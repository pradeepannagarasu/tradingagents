# NSE transaction-cost schedule (INR). Rates are fractions of turnover unless noted.
# Effective-dated so historical backtests use the rate in force at the time.
#
# VERIFY BEFORE RELYING ON THESE NUMBERS. They were compiled on 2026-11-07 from
# secondary summaries of Finance Acts / NSE circulars, not from the primary texts.
# In particular the 2026-04-01 F&O STT increase (Union Budget 2026) has conflicting
# effective dates in secondary sources. Check incometaxindia.gov.in and NSE circulars.

