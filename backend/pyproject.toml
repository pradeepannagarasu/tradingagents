[project]
name = "triagent"
version = "0.1.0"
description = "Tri-agent (BULL/BEAR/JUDGE) market intelligence and paper-trading platform — research & decision support"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["triagent*"]

[tool.setuptools.package-data]
"triagent.agents" = ["prompts/*.md"]
